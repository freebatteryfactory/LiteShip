name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Serial gauntlet kept as nightly deep-verify (Phase B CI cutover: parallel is the merge gate).
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every test host receives the same exact review baseline inputs. The
# cross-platform preparation script fetches only this object (or the named
# fallback branch on first-push/manual events) and fails closed if the committed
# standards snapshot is absent.
env:
  LITESHIP_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  LITESHIP_CI_BASE_REF: ${{ github.base_ref || 'main' }}

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: plan
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run registry-projected format check
        env:
          PROJECTED_COMMAND: ${{ fromJSON(needs.plan.outputs.matrix).specializedChecks.format.command }}
        run: bash -c "$PROJECTED_COMMAND"

  # Registry-projected CI plan. The parallel merge gate is the RELEASE gauntlet fanned
  # out, so scripts/ci-plan.ts (a PURE projection of @liteship/command's CHECK_REGISTRY —
  # the same source the serial gauntlet phase list projects) partitions the registry into
  # the named parallel lanes and emits them as this job's `matrix` output. Each gauntlet
  # lane then consumes `fromJSON(needs.plan.outputs.matrix)` to confirm — at CI runtime —
  # that its hand-written lane command still matches the projection (the offline meta test
  # tests/unit/meta/ci-registry-parity.test.ts proves byte-identity at merge time).
  # The lane matrix stays dist-free: ci-plan reads only the self-contained check-registry
  # source. The affected selector then consumes the full live assurance inventory, so the
  # workspace build is its explicit prerequisite rather than an accidental ambient artifact.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      affected-browser-required: ${{ steps.affected.outputs.browser-required }}
      affected-benchmark-required: ${{ steps.affected.outputs.benchmark-required }}
      affected-rust-wasm-required: ${{ steps.affected.outputs.rust-wasm-required }}
      affected-plan-id: ${{ steps.affected.outputs.plan-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate change intent before expensive authority
        run: pnpm exec tsx scripts/validate-github-change-intent.ts
      - id: plan
        name: Emit the registry-projected lane matrix
        # The projection emits compact one-line JSON. Capture it before writing
        # the output record so a planner failure cannot create a partial record
        # or bury its root error behind GitHub's multiline-delimiter parser.
        run: |
          matrix_json="$(pnpm exec tsx scripts/ci-plan.ts)"
          printf 'matrix=%s\n' "$matrix_json" >> "$GITHUB_OUTPUT"
      - name: Build workspace dependencies for the assurance-aware affected selector
        run: pnpm run build
      - id: affected
        name: Emit the conservative affected-test plan
        env:
          LITESHIP_AFFECTED_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || 'origin/main' }}
        run: pnpm exec tsx scripts/affected-plan.ts --output .liteship/affected-plan.json --calibration-output .liteship/affected-selector-calibration.json --github-output "$GITHUB_OUTPUT"
      - name: Upload the addressed plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: affected-plan
          path: |
            .liteship/affected-plan.json
            .liteship/affected-selector-calibration.json
          if-no-files-found: error
          retention-days: 7

  # Pull-request fast feedback: cheap registry checks plus the canonical package-DAG
  # affected closure. This supplements, but never replaces, the full candidate authority below.
  pr-affected:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: plan
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare Node-test host authority
        run: pnpm exec tsx scripts/prepare-ci-test-host.ts --ffmpeg --standards-base
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: affected-plan
          path: .liteship
      - run: pnpm run build
      - id: quick
        run: pnpm run check --profile quick --no-cache
      - id: vitest
        run: pnpm run test:affected
        env:
          CI: true
          LITESHIP_AFFECTED_BASE: origin/${{ github.base_ref }}
          LITESHIP_AFFECTED_PLAN_PATH: .liteship/affected-plan.json
          LITESHIP_AFFECTED_JUNIT_PATH: reports/vitest-results-pr-affected.xml
      - name: Run benchmark authority selected by the affected plan
        id: benchmark
        if: needs.plan.outputs.affected-benchmark-required == 'true'
        run: pnpm run bench
      - name: Record affected Linux execution state
        if: always()
        run: pnpm exec tsx scripts/write-affected-result-evidence.ts
        env:
          LITESHIP_AFFECTED_LANE: pr-linux
          LITESHIP_AFFECTED_STEPS: quick,vitest,benchmark
          LITESHIP_AFFECTED_PLAN_ID: ${{ needs.plan.outputs.affected-plan-id }}
          LITESHIP_AFFECTED_OUTCOME_QUICK: ${{ steps.quick.outcome }}
          LITESHIP_AFFECTED_OUTCOME_VITEST: ${{ steps.vitest.outcome }}
          LITESHIP_AFFECTED_OUTCOME_BENCHMARK: ${{ steps.benchmark.outcome }}
          LITESHIP_AFFECTED_EVIDENCE_VITEST: reports/vitest-results-pr-affected.xml
          LITESHIP_AFFECTED_RESULT_PATH: reports/affected-result-pr-linux.json
      - name: Upload affected Linux test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vitest-results-pr-affected
          path: |
            reports/affected-result-pr-linux.json
            reports/vitest-results-pr-affected.xml
          if-no-files-found: error

  pr-browser-affected:
    if: github.event_name == 'pull_request' && needs.plan.outputs.affected-browser-required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: plan
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: affected-plan
          path: .liteship
      - run: pnpm run build
      - run: pnpm exec tsx scripts/affected-plan.ts --verify-current-head --input .liteship/affected-plan.json
      - run: pnpm exec playwright install --with-deps chromium chromium-headless-shell
      - id: vitest
        run: >-
          pnpm exec vitest run --config vitest.browser.config.ts
          --reporter=default --reporter=junit
          --outputFile.junit=reports/vitest-results-pr-browser-affected.xml
        env:
          CI: true
          LITESHIP_VITEST_BROWSERS: chromium
      - name: Run the declared browser E2E authority
        id: e2e
        run: pnpm run test:e2e
        env:
          CI: true
          LITESHIP_PLAYWRIGHT_BROWSER: chromium
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: reports/playwright-results-pr-browser-affected.xml
      - name: Record affected browser execution state
        if: always()
        run: pnpm exec tsx scripts/write-affected-result-evidence.ts
        env:
          LITESHIP_AFFECTED_LANE: pr-browser
          LITESHIP_AFFECTED_PLAN_ID: ${{ needs.plan.outputs.affected-plan-id }}
          LITESHIP_AFFECTED_STEPS: vitest,e2e
          LITESHIP_AFFECTED_OUTCOME_VITEST: ${{ steps.vitest.outcome }}
          LITESHIP_AFFECTED_OUTCOME_E2E: ${{ steps.e2e.outcome }}
          LITESHIP_AFFECTED_EVIDENCE_VITEST: reports/vitest-results-pr-browser-affected.xml
          LITESHIP_AFFECTED_EVIDENCE_E2E: reports/playwright-results-pr-browser-affected.xml
          LITESHIP_AFFECTED_RESULT_PATH: reports/affected-result-pr-browser.json
      - name: Upload affected browser test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-pr-browser-affected
          path: |
            reports/affected-result-pr-browser.json
            reports/vitest-results-pr-browser-affected.xml
            reports/playwright-results-pr-browser-affected.xml
          if-no-files-found: error

  pr-windows-affected:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    needs: plan
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare Node-test host authority
        run: pnpm exec tsx scripts/prepare-ci-test-host.ts --ffmpeg --standards-base
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: affected-plan
          path: .liteship
      - run: pnpm run build
      - id: vitest
        run: pnpm run test:affected
        env:
          CI: true
          LITESHIP_AFFECTED_BASE: origin/${{ github.base_ref }}
          LITESHIP_AFFECTED_PLAN_PATH: .liteship/affected-plan.json
          LITESHIP_AFFECTED_JUNIT_PATH: reports/vitest-results-pr-windows-affected.xml
      - name: Record affected Windows execution state
        if: always()
        run: pnpm exec tsx scripts/write-affected-result-evidence.ts
        env:
          LITESHIP_AFFECTED_LANE: pr-windows
          LITESHIP_AFFECTED_PLAN_ID: ${{ needs.plan.outputs.affected-plan-id }}
          LITESHIP_AFFECTED_STEPS: vitest
          LITESHIP_AFFECTED_OUTCOME_VITEST: ${{ steps.vitest.outcome }}
          LITESHIP_AFFECTED_EVIDENCE_VITEST: reports/vitest-results-pr-windows-affected.xml
          LITESHIP_AFFECTED_RESULT_PATH: reports/affected-result-pr-windows.json
      - name: Upload affected Windows test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vitest-results-pr-windows-affected
          path: |
            reports/affected-result-pr-windows.json
            reports/vitest-results-pr-windows-affected.xml
          if-no-files-found: error

  pr-affected-evidence:
    if: always() && github.event_name == 'pull_request' && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - plan
      - pr-affected
      - pr-browser-affected
      - pr-windows-affected
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies for affected-result admission
        run: pnpm run build
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: affected-plan
          path: .liteship
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: vitest-results-pr-affected
          path: .liteship/affected-results/pr-linux
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: vitest-results-pr-windows-affected
          path: .liteship/affected-results/pr-windows
      - if: needs.plan.outputs.affected-browser-required == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: test-results-pr-browser-affected
          path: .liteship/affected-results/pr-browser
      - name: Admit selected affected execution receipts
        run: >-
          pnpm exec tsx scripts/verify-affected-result-evidence.ts
          .liteship/affected-plan.json
          .liteship/affected-results
          reports/affected-result-admission.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: affected-result-admission
          path: reports/affected-result-admission.json
          if-no-files-found: error

  # Serial full gauntlet — nightly/manual exhaustive authority. Pull requests use
  # the conservative affected closure; pushes use the full parallel projection.
  truth-linux:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # fetch-depth: 0 brings the FULL history so the standards:gate phase can run
      # `git show <base>:traceability/standards-snapshot.json` against the review base
      # (the raccoon-rule backstop diffs the LIVE surface against the PRIOR, INDEPENDENT
      # baseline — never the working-tree snapshot). A shallow checkout has neither the
      # parent commit nor the fetched base branch, so the gate would fail CLOSED.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium chromium-headless-shell
      - name: Prepare Node-test host authority
        run: pnpm exec tsx scripts/prepare-ci-test-host.ts --ffmpeg --standards-base
      - run: pnpm run build
      - name: Configure git identity for doctor --ci
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
      - run: pnpm run gauntlet:full
        env:
          CI: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        continue-on-error: true
        with:
          name: truth-artifacts-linux
          path: |
            coverage
            reports
            benchmarks

  # Parallel truth-linux lane — the pre-merge candidate gate and post-merge confirmation.
  # Build once, fan out: vitest shards N=4, isolated bench, quarantined capsule:verify.
  # Bench is NEVER sharded.
  truth-linux-parallel-setup:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - plan
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # action implementation pinned
        with:
          # Projection of rust-toolchain.toml; check/devcontainer-pins rejects drift.
          toolchain: 1.85.1
          targets: wasm32-unknown-unknown
      - run: pnpm exec playwright install --with-deps chromium chromium-headless-shell
      - name: Prepare ffmpeg render capability
        run: pnpm exec tsx scripts/prepare-ci-test-host.ts --ffmpeg
      - name: Configure git identity for doctor --ci
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
      - run: pnpm run build && pnpm run capsule:compile
      - name: Run registry-projected environment doctor
        env:
          PROJECTED_COMMAND: ${{ fromJSON(needs.plan.outputs.matrix).specializedChecks.doctor.command }}
        run: bash -c "$PROJECTED_COMMAND"
      - name: Mint gauntlet run context for parallel fan-out
        run: pnpm exec tsx scripts/mint-gauntlet-context.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-packages
          path: |
            packages/*/dist
            reports/capsule-manifest.json
            reports/gauntlet-context.json
          retention-days: 1

  truth-linux-parallel-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - truth-linux-parallel-setup
      - plan
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare preflight standards authority
        run: pnpm exec tsx scripts/prepare-ci-test-host.ts --standards-base
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist-packages
          path: .
      - name: Confirm lane matches the registry-projected plan
        env:
          PLANNED_PROFILE: ${{ fromJSON(needs.plan.outputs.matrix).lanes.preflight.profile }}
        run: test "$PLANNED_PROFILE" = "ci-parallel-preflight"
      - run: pnpm run gauntlet:full -- --profile ci-parallel-preflight --skip-build
        env:
          CI: true

  truth-linux-parallel-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - truth-linux-parallel-setup
      - plan
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare sharded Node-test host authority
        run: pnpm exec tsx scripts/prepare-ci-test-host.ts --ffmpeg --standards-base
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist-packages
          path: .
      - name: Confirm lane matches the registry-projected plan
        env:
          PLANNED_COMMAND: ${{ fromJSON(needs.plan.outputs.matrix).lanes.shardedTest.command }}
        run: test "$PLANNED_COMMAND" = "pnpm run test:shard"
      - run: pnpm run test:shard
        env:
          CI: true
          LITESHIP_SHARD_INDEX: ${{ matrix.shard }}
          LITESHIP_SHARD_TOTAL: 4
      - name: Stage shard coverage for artifact upload
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p "ci-artifacts/coverage/node-shard-$SHARD"
          if [ -d "coverage/node-shard-$SHARD" ]; then
            cp -r "coverage/node-shard-$SHARD/." "ci-artifacts/coverage/node-shard-$SHARD/"
          fi
          if [ -d "coverage/subprocess-raw-shard/$SHARD" ]; then
            mkdir -p "ci-artifacts/coverage/subprocess-raw-shard/$SHARD"
            cp -r "coverage/subprocess-raw-shard/$SHARD/." "ci-artifacts/coverage/subprocess-raw-shard/$SHARD/"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: ci-artifacts/coverage
          retention-days: 1

  truth-linux-parallel-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - truth-linux-parallel-setup
      - plan
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist-packages
          path: .
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # action implementation pinned
        with:
          # Projection of rust-toolchain.toml; check/devcontainer-pins rejects drift.
          toolchain: 1.85.1
          targets: wasm32-unknown-unknown
      - run: pnpm exec playwright install --with-deps chromium chromium-headless-shell
      - name: Prepare ffmpeg render capability
        run: pnpm exec tsx scripts/prepare-ci-test-host.ts --ffmpeg
      - run: pnpm run build:wasm
      - name: Confirm lane matches the registry-projected plan
        env:
          PLANNED_PROFILE: ${{ fromJSON(needs.plan.outputs.matrix).lanes.bench.profile }}
        run: test "$PLANNED_PROFILE" = "ci-parallel-bench"
      - run: pnpm run gauntlet:full -- --profile ci-parallel-bench --skip-build
        env:
          CI: true

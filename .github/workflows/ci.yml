  # Exhaustive trust-spine campaigns are isolated because mutation and MC/DC
  # rewrite source temporarily. They run nightly/manual and on the exact release
  # tag through workflow_call, never in the pull-request hot path.
  exhaustive-analysis:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Run the non-mutating exhaustive IR campaign
        run: |
          mkdir -p reports/exhaustive
          set -o pipefail
          pnpm exec tsx packages/cli/src/bin.ts check gates --ir --no-cache --symbols --supply-chain --simulate --taint --proof --composition --capability-gate --spine-relation 2>&1 | tee reports/exhaustive/analysis.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: exhaustive-analysis-${{ github.run_attempt }}
          path: reports/exhaustive
          retention-days: 7

  exhaustive-mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # SHARDED census (run 30606178745 measured ~9.5 min/target — 110 targets
    # exceed any single job; the wall budget only makes the crawl exit
    # politely). Each shard OWNS index % 6 of the census, banks its verdicts,
    # and the fold job below re-earns the FULL census from the merged bank.
    # During initial convergence a shard's gates exit red (unbanked foreign
    # targets fold inconclusive) — the FOLD job is the authority; once the
    # bank is complete every foreign target cache-hits and shards go green.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      # RESTORE/SAVE split, never the combined action (PR #194 review,
      # confirmed P1: its post-if success() save skips red runs).
      # Restore-keys lead with the SAME-RUN fold (the broadest same-run
      # bank — a re-run resumes every shard's attempt-1 verdicts), then
      # the same-run shard slice (interrupted-fold recovery), then each

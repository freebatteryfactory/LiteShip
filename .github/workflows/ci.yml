  semantic-assurance-admission:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - exhaustive-mutation-fold
      - exhaustive-mcdc-fold
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies for semantic admission
        run: pnpm run build
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: semantic-assurance-mutation-${{ github.run_attempt }}
          path: reports
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: semantic-assurance-mcdc-${{ github.run_attempt }}
          path: reports
      - name: Independently admit the two live semantic-assurance receipts
        run: pnpm run assurance:gate -- --require-semantic
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: semantic-assurance-admission-${{ github.run_attempt }}
          path: |
            reports/semantic-assurance-mutation.json
            reports/semantic-assurance-mcdc.json
            reports/assurance-inventory.json
          if-no-files-found: error
          retention-days: 30

  security-audit:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - plan
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prove governed security minimums
        run: pnpm run security:minimum
      - name: Query the live advisory registry
        env:
          PROJECTED_COMMAND: ${{ fromJSON(needs.plan.outputs.matrix).specializedChecks.securityAudit.command }}
        run: bash -c "$PROJECTED_COMMAND"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        continue-on-error: true
        with:
          name: security-audit-${{ github.run_attempt }}
          path: |
            reports/pnpm-audit.json
            reports/pnpm-audit.stderr.txt
          if-no-files-found: warn
          retention-days: 30

  ci-summary:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - plan
      - format
      - pr-affected
      - pr-browser-affected
      - pr-windows-affected
      - pr-affected-evidence
      - truth-linux
      - truth-linux-parallel
      - browser-e2e
      - windows-smoke
      - macos-smoke
      - macos-browser
      - rust-wasm-parity
      - security-audit
      - exhaustive-analysis
      - exhaustive-mutation
      - exhaustive-mutation-fold
      - exhaustive-mcdc
      - exhaustive-mcdc-fold
      - semantic-assurance-admission
      - evidence-admission
    steps:
      - name: Fold the event-appropriate authority tier
        env:
          EVENT: ${{ github.event_name }}
          FORMAT: ${{ needs.format.result }}
          PR_AFFECTED: ${{ needs.pr-affected.result }}
          PR_BROWSER: ${{ needs.pr-browser-affected.result }}
          BROWSER_REQUIRED: ${{ needs.plan.outputs.affected-browser-required }}
          PR_WINDOWS: ${{ needs.pr-windows-affected.result }}
          PR_EVIDENCE: ${{ needs.pr-affected-evidence.result }}
          SERIAL: ${{ needs.truth-linux.result }}
          PARALLEL: ${{ needs.truth-linux-parallel.result }}
          BROWSER: ${{ needs.browser-e2e.result }}
          WINDOWS: ${{ needs.windows-smoke.result }}
          MACOS: ${{ needs.macos-smoke.result }}
          MACOS_BROWSER: ${{ needs.macos-browser.result }}
          RUST_WASM: ${{ needs.rust-wasm-parity.result }}
          EXHAUSTIVE_ANALYSIS: ${{ needs.exhaustive-analysis.result }}
          # The FOLD results carry the authority — shards are builders whose
          # red is expected while the bank converges.
          EXHAUSTIVE_MUTATION: ${{ needs.exhaustive-mutation-fold.result }}
          EXHAUSTIVE_MCDC: ${{ needs.exhaustive-mcdc-fold.result }}
          SEMANTIC_ASSURANCE_ADMISSION: ${{ needs.semantic-assurance-admission.result }}
          SECURITY_AUDIT: ${{ needs.security-audit.result }}
          EVIDENCE_ADMISSION: ${{ needs.evidence-admission.result }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$EVIDENCE_ADMISSION" = "success"
          test "$FORMAT" = "success"
          test "$SECURITY_AUDIT" = "success"
          if [ "$EVENT" = "pull_request" ]; then
            test "$PR_AFFECTED" = "success"
            test "$PR_WINDOWS" = "success"
            test "$PR_EVIDENCE" = "success"
            if [ "$BROWSER_REQUIRED" = "true" ]; then
              test "$PR_BROWSER" = "success"
            else
              test "$PR_BROWSER" = "skipped"
            fi
            test "$PARALLEL" = "success"
            test "$BROWSER" = "success"
            test "$WINDOWS" = "success"
            test "$MACOS" = "success"
            test "$MACOS_BROWSER" = "success"
            test "$RUST_WASM" = "success"
            echo "CI pull-request authority passed (affected feedback + full release candidate)."
          else
            if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then
              test "$SERIAL" = "success"
            else
              test "$PARALLEL" = "success"
            fi
            test "$BROWSER" = "success"
            test "$WINDOWS" = "success"
            test "$MACOS" = "success"
            test "$MACOS_BROWSER" = "success"
            test "$RUST_WASM" = "success"
            if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ] || [[ "$REF" == refs/tags/v* ]]; then
              test "$EXHAUSTIVE_ANALYSIS" = "success"
              test "$EXHAUSTIVE_MUTATION" = "success"
              test "$EXHAUSTIVE_MCDC" = "success"
              test "$SEMANTIC_ASSURANCE_ADMISSION" = "success"
            fi
            echo "CI exhaustive authority passed."
          fi

  delivery-evidence-collect:
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - plan
      - format
      - pr-affected
      - pr-browser-affected
      - pr-windows-affected
      - pr-affected-evidence
      - truth-linux
      - truth-linux-parallel
      - browser-e2e
      - windows-smoke
      - macos-smoke
      - macos-browser
      - rust-wasm-parity
      - security-audit
      - exhaustive-analysis
      - exhaustive-mutation
      - exhaustive-mutation-fold
      - exhaustive-mcdc
      - exhaustive-mcdc-fold
      - semantic-assurance-admission
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Delivery metrics build governed-exception facts through the same
          # fail-closed standards reader as the gauntlet. Its independent base
          # snapshot must therefore exist locally; a depth-1 PR checkout only
          # carries the synthetic merge ref and cannot resolve origin/main.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: affected-plan
          path: .liteship
      - name: Download flake evidence when the campaign reached its evidence write
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: flake-evidence
          path: reports
      - run: pnpm run build
      - name: Collect evidence-native delivery metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          pnpm exec tsx scripts/collect-delivery-metrics.ts
          .liteship/affected-plan.json
          reports/delivery-metrics.json
          .liteship/affected-selector-calibration.json
          reports/flake-evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: delivery-evidence-candidates
          path: |
            reports/change-intent.json
            reports/ci-authority.json
            reports/governed-exceptions.json
            reports/check-reports.json
            reports/checks
            reports/delivery-metrics.json
          if-no-files-found: error
          retention-days: 30

  evidence-admission:
    if: always() && needs.plan.result == 'success' && needs.delivery-evidence-collect.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - plan
      - delivery-evidence-collect
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: affected-plan
          path: .liteship
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: delivery-evidence-candidates
          # upload-artifact strips the common `reports/` root. Restore the
          # candidate files beneath that canonical root before admission.
          path: reports
      - name: Build runtime dependencies for receipt-DAG validation
        run: pnpm run build
      - name: Independently admit exact delivery evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          pnpm exec tsx scripts/admit-delivery-evidence.ts
          .liteship/affected-plan.json
          .
          reports/delivery-evidence-manifest.json
          reports/delivery-admission-receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: delivery-evidence
          path: |
            reports/change-intent.json
            reports/ci-authority.json
            reports/governed-exceptions.json
            reports/check-reports.json
            reports/checks
            reports/delivery-metrics.json
            reports/delivery-evidence-manifest.json
            reports/delivery-receipt-chain.json
            reports/delivery-admission-receipt.json
          if-no-files-found: error
          retention-days: 30

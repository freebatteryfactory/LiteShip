# The trace — every invariant in invariants.yaml mapped to its proving test(s) OR
# a waiver-with-teeth. This is one half of the bidirectional trace: the OTHER half
# is the `// PROVES: <id>` header the proving test itself carries. The deterministic
# state machine (packages/cli/src/internal/traceability.ts) scans the LIVE headers and
# REQUIRES the two agree — a ledger entry whose claimed test lacks a matching header
# (or vice versa) is a divergence finding (the head-probe LAW).
#
# Schema (per entry):
#   id:      the invariant id from invariants.yaml (REQUIRED)
#   tests:   a non-empty list of [file::test-name] proving refs    (the TRACED form)
#     -- the file is repo-relative; test-name is an exact full nested Vitest title,
#        or an exact leaf title only when that leaf is unique within the file.
#   waiver:  { owner, justification, expiry }                       (the WAIVED form)
#     -- expiry is an ISO yyyy-mm-dd; a past expiry re-reds (the waiver came due).
# Exactly ONE of `tests` / `waiver` per entry (a trace OR a signed deferral).

traces:
  # ── HLC — tests/property/hlc-crdt-laws.prop.test.ts ─────────────────────────
  - id: INV-HLC-JOIN-IDEMPOTENT
    tests:
      - 'tests/property/hlc-crdt-laws.prop.test.ts::IDEMPOTENCE: join(a, a) ≡ a'
  - id: INV-HLC-JOIN-COMMUTATIVE
    tests:
      - 'tests/property/hlc-crdt-laws.prop.test.ts::COMMUTATIVITY: join(a, b) ≡ join(b, a)'
  - id: INV-HLC-JOIN-ASSOCIATIVE
    tests:
      - 'tests/property/hlc-crdt-laws.prop.test.ts::ASSOCIATIVITY: join(join(a, b), c) ≡ join(a, join(b, c))'
  - id: INV-HLC-ORDER-TRANSITIVE
    tests:
      - 'tests/property/hlc-crdt-laws.prop.test.ts::TRANSITIVITY of happens-before: compare(a,b)<0 && compare(b,c)<0 ⟹ compare(a,c)<0'
  - id: INV-HLC-ORDER-TOTAL
    tests:
      - 'tests/property/hlc-crdt-laws.prop.test.ts::TOTALITY: exactly one of compare<0, ===0, compare>0 holds for every pair'
  - id: INV-HLC-MERGE-DOMINANCE
    tests:
      - 'tests/property/hlc-crdt-laws.prop.test.ts::DOMINANCE: merge(local, remote, now) is ≥ BOTH inputs on (wall, counter)'

  # ── GraphPatch — tests/property/graph-patch-crdt-laws.prop.test.ts ──────────
  - id: INV-GRAPHPATCH-IDEMPOTENT
    tests:
      - 'tests/property/graph-patch-crdt-laws.prop.test.ts::apply(base, p) twice yields the SAME content-address id'
  - id: INV-GRAPHPATCH-COMMUTATIVE
    tests:
      - 'tests/property/graph-patch-crdt-laws.prop.test.ts::apply(apply(G, p1), p2) and apply(apply(G, p2), p1) reach the SAME id'
  - id: INV-GRAPHPATCH-CONVERGENCE
    tests:
      - 'tests/property/graph-patch-crdt-laws.prop.test.ts::3 concurrent non-conflicting adds converge to ONE id across all 6 orderings'
  - id: INV-GRAPHPATCH-CONFLICT-BOUNDARY
    tests:
      - 'tests/property/graph-patch-crdt-laws.prop.test.ts::conflicting patches (same logical cell, different payload) are ORDER-DEPENDENT at the apply layer'
      - 'tests/property/graph-patch-crdt-laws.prop.test.ts::the fork-detection seam SURFACES two concurrent patches off a shared base (forkOf → DAG.isFork)'

  # ── Content-address — tests/property/content-address.prop.test.ts ───────────
  - id: INV-CONTENT-ADDRESS-DETERMINISTIC
    tests:
      - 'tests/property/content-address.prop.test.ts::same boundary config → same content address'
      - 'tests/property/content-address.prop.test.ts::different inputs → different content addresses'
      - 'tests/property/canonical-value-domain.prop.test.ts::hashes strings through the same UTF-8 byte law as fnv1aBytes'

  # ── Adaptive lowering — tests/property/adaptive-lowering-equivalence.prop.test.ts ─
  - id: INV-ADAPTIVE-LOWERING-PURE
    tests:
      - 'tests/property/adaptive-lowering-equivalence.prop.test.ts::INV-ADAPTIVE-LOWERING-PURE: adaptive members equal the independently hand-lowered constructor outputs (ids, deep-equal, referential quantizer)'
  - id: INV-ADAPTIVE-CSS-BYTE-EQUAL
    tests:
      - 'tests/property/adaptive-lowering-equivalence.prop.test.ts::INV-ADAPTIVE-CSS-BYTE-EQUAL: the public adaptive plan CSS is byte-identical to the hand-lowered compiler output'
      - 'tests/e2e/astro-directives.e2e.ts::attrs plus plan CSS follow runtime state without cross-definition bleed'
  - id: INV-ADAPTIVE-TRACE-EQUAL
    tests:
      - 'tests/property/adaptive-lowering-equivalence.prop.test.ts::INV-ADAPTIVE-TRACE-EQUAL: public explanations and live crossing/output receipts equal the hand-lowered runtime sweep'

  # ── Beginner surface ────────────────────────────────────────────────────────
  - id: INV-BEGINNER-SURFACE
    tests:
      - 'tests/unit/devops/beginner-surface-contract.test.ts::derives define -> apply -> inspect from the flagship public contract'
      - 'tests/property/beginner-surface-contract.prop.test.ts::rejects any fourth root concept even when the facade legitimately exports it'

  # ── Assurance propagation — tests/unit/gauntlet/assurance-propagation.test.ts ─
  - id: INV-ASSURANCE-PROPAGATION-MONOTONIC
    tests:
      - 'tests/unit/gauntlet/assurance-propagation.test.ts::LAW: every file effective >= its base (propagation only raises) — over random DAGs+cycles'
  - id: INV-ASSURANCE-PROPAGATION-DETERMINISTIC
    tests:
      - 'tests/unit/gauntlet/assurance-propagation.test.ts::determinism: computing twice yields an identical map'

  # ── DST substrate — tests/unit/core/simulation-determinism-substrate.test.ts ─
  - id: INV-DST-TRACE-CONTENT-ADDRESSED
    tests:
      - 'tests/unit/core/simulation-determinism-substrate.test.ts::the trace digest is minted through the ONE content-address kernel (contentAddressOf), never forked'
  - id: INV-DST-NO-AMBIENT-ENTROPY
    tests:
      - 'tests/unit/core/simulation-determinism-substrate.test.ts::the harness imports its time/randomness ONLY from the @liteship/core substrate (manualClock / seededRng)'

  # ── Supply-chain — tests/unit/gauntlet/supply-chain-gate.test.ts ────────────
  - id: INV-SUPPLY-CHAIN-HERMETIC
    tests:
      - 'tests/unit/gauntlet/supply-chain-gate.test.ts::a git-URL lockfile violation reds the gate'
      - 'tests/unit/gauntlet/supply-chain-gate.test.ts::an incomplete SBOM reds the gate'
      - 'tests/unit/gauntlet/supply-chain-gate.test.ts::a drifted lockfile_address reds the gate'
  - id: INV-SUPPLY-CHAIN-NO-AMBIENT-CI
    tests:
      - 'tests/unit/gauntlet/supply-chain-gate.test.ts::an ambient NPM_TOKEN reds the gate'

  # ── Mutation engine — tests/unit/audit/mutation-facts-build.test.ts ─────────
  - id: INV-MUTATION-FACTS-DETERMINISTIC
    tests:
      - 'tests/unit/audit/mutation-facts-build.test.ts::is deterministic — same source + runner → byte-identical facts'

  # ── Transition cage — tests/unit/audit/transition-facts-build.test.ts ───────
  - id: INV-TRANSITION-FACTS-DETERMINISTIC
    tests:
      - 'tests/unit/audit/transition-facts-build.test.ts::is deterministic — same inputs → byte-identical facts (order-independent)'
      - 'tests/unit/audit/transition-facts-build.test.ts::decides equivalent (digests agree) / divergent (digests differ) / unevidenced (a side missing)'

  # ── Verdict cache + repo-IR — the B2 content-addressed-cache soundness spine ─
  - id: INV-VERDICT-CACHE-KEY-DETERMINISTIC
    tests:
      - 'tests/property/verdict-cache-determinism.prop.test.ts::SAME inputs ⇒ BYTE-IDENTICAL key, regardless of env insertion order'
      - 'tests/property/verdict-cache-determinism.prop.test.ts::coverageDigestOf is order- and multiplicity-independent (sorted, de-duped fold)'
  - id: INV-TOOLCHAIN-DIGEST-INVALIDATES
    tests:
      - 'tests/property/verdict-cache-determinism.prop.test.ts::a different toolchainDigest moves the key (a gate-logic edit invalidates every cached verdict)'
      - 'tests/property/verdict-cache-determinism.prop.test.ts::a different gateId / coverageDigest / env value each move the key (no stale serve across any input)'
      - 'tests/property/verdict-cache-determinism.prop.test.ts::a TAMPERED covered-file digest flips the coverage digest ⇒ flips the key (the cache would catch it)'
  - id: INV-REPO-IR-DETERMINISTIC
    tests:
      - 'tests/property/repo-ir-determinism.prop.test.ts::builds a BYTE-IDENTICAL IR twice over the same corpus — per-file digests + the full fold'
      - 'tests/property/repo-ir-determinism.prop.test.ts::a single edited byte CHANGES that file digest (the digest tracks content, the cache-miss trigger)'

  # ── Zero-allocation hot paths — the allocation gate (node --expose-gc) ───────
  - id: INV-COMPOSITOR-ZERO-ALLOC
    tests:
      - 'tests/property/compositor-zero-alloc.test.ts::the compositor compose hot path is a NEGLIGIBLE fraction of a known-allocating reference (platform-robust live ratio)'
      - 'tests/property/compositor-zero-alloc.test.ts::the compositor reactive publish is a NEGLIGIBLE fraction of churn with no subscriber, and a BOUNDED fraction with one (platform-robust transient ratios)'
      - 'tests/property/compositor-zero-alloc.test.ts::the compositor reactive publish is a raw listener-set fan-out, NOT the per-publish-allocating SubscriptionRef.set (source drift guard)'
  - id: INV-TOKEN-BUFFER-ZERO-ALLOC
    tests:
      - 'tests/property/token-buffer-zero-alloc.test.ts::the token-buffer hot path is a NEGLIGIBLE fraction of a known-allocating reference (platform-robust live ratio)'

  # ── Security (shader content integrity — defense-in-depth content guard) ────
  - id: INV-SHADER-CONTENT-INTEGRITY
    tests:
      - 'tests/unit/web/shader-integrity.test.ts::VERIFIES content whose bytes match the author-pinned hash'
      - 'tests/unit/web/shader-integrity.test.ts::reports a MISMATCH when a single byte is tampered'
      - 'tests/unit/web/shader-integrity.test.ts::an absent pin REFUSES under the secure default but is allowed under lenient'
      - 'tests/unit/astro/shader-integrity-integration.test.ts::a TAMPERED fetched shader is REFUSED — security diagnostic fires, gl.shaderSource never sees the body'
      - 'tests/unit/astro/shader-integrity-integration.test.ts::a TAMPERED fetched WGSL shader is REFUSED — no createShaderModule, security diagnostic fires'
      - 'tests/integration/cli/shader-taint-sanitized-live.test.ts::every fetch→shader-compile-sink flow is broken by verifyShaderIntegrity on the path'

  # ── Security (taint source→sink oracle) — the generic dataflow trace + gate ──
  # Proven from BOTH ends: the host oracle (repo-ir-taint) traces real tmp corpora,
  # the lean gate (taint-flow-gate) folds the facts. Both files carry `// PROVES:`.
  - id: INV-TAINT-SOURCE-SINK
    tests:
      - 'tests/unit/audit/repo-ir-taint.test.ts::flags an UNSANITIZED source→sink flow with sanitizedBy null'
      - 'tests/unit/audit/repo-ir-taint.test.ts::emits a SANITIZED flow (taint broken) when a sanitizer wraps the value'
      - 'tests/unit/audit/repo-ir-taint.test.ts::is deterministic — tracing twice over unchanged source yields identical flows'
      - 'tests/unit/gauntlet/taint-flow-gate.test.ts::reds an L4 error finding located at the SINK, naming both endpoints'
      - 'tests/unit/gauntlet/taint-flow-gate.test.ts::emits NOTHING for a flow broken by a sanitizer (the guarded-seam green)'

  # ── Meta (crdt-laws coverage rail) — tests/property/crdt-laws-gate.test.ts ──
  - id: INV-CRDT-LAWS-PINNED
    tests:
      - 'tests/property/crdt-laws-gate.test.ts::FLAGS a repo whose law file pins only SOME of the required laws (the red fixture world)'
      - 'tests/property/crdt-laws-gate.test.ts::passes its OWN green fixture clean (no false positive on a fully-pinned repo)'

  # ── Assurance (negative-control partition) — tests/unit/devops/check-registry.test.ts ─
  - id: INV-CHECK-NEGATIVE-CONTROL
    tests:
      - 'tests/unit/devops/check-registry.test.ts::every blocking check declares an existing negative control'
      - 'tests/unit/devops/blocking-check-negative-controls.test.ts::the grouped harness enrollment is exact (no blocker can inherit a decorative path)'
      - 'tests/property/blocking-check-negative-control-relation.prop.test.ts::production execution binds every exact id and command to red/nonzero and green/zero'
      - 'tests/unit/devops/runtime-gate-negative-control.test.ts::check/runtime-gate negative control > the runtime owner rejects every semantic warning/seam mutation and admits the neutralized evidence'
      - 'tests/unit/devops/flex-policy-negative-control.test.ts::check/flex-verify + check/devx negative control > the shared policy owner rejects each malformed threshold/label class and admits the neutralized policy'

  # ── Meta (single-source roster) — one typed catalog; every consumer is a projection ─
  - id: INV-ROSTER-SINGLE-SOURCE
    tests:
      - 'tests/unit/devops/package-catalog.test.ts::accepts the exact 25-record catalog against independent manifests'
      - 'tests/unit/devops/package-catalog.test.ts::rejects a second authored full-fleet list but permits generated and red-fixture sources'
      - 'tests/unit/audit/package-roster.test.ts::equals the generated canonical roster in dependency order'
      - 'tests/unit/meta/release-roster-projection.test.ts::carries no @liteship/* package literals in its run blocks'

  # ── Meta (single brand) — tests/unit/meta/brand-residue.test.ts (this ledger file is allowlisted there) ─
  - id: INV-BRAND-RESIDUE-ZERO
    tests:
      - 'tests/unit/meta/brand-residue.test.ts::no `czap` residue outside the sanctioned ARCHITECTURE sentence and the frozen allowlist'

  # ── Assurance (facade export budget — exact-match, both directions) — tests/unit/liteship/facade-subpaths.test.ts ─
  - id: INV-FACADE-EXPORT-BUDGET
    tests:
      - 'tests/unit/liteship/facade-subpaths.test.ts::self-proves (red caught, green clean, mutation killed)'
      - 'tests/unit/liteship/facade-subpaths.test.ts::an UNLISTED export reds (the sprawl direction)'
      - 'tests/unit/liteship/facade-subpaths.test.ts::a DROPPED listed export reds (the regression direction the old SUBSET gate was blind to)'
      - 'tests/property/facade-export-budget.prop.test.ts::rejects missing, foreign, empty, and non-string contract fields atomically'
      - 'tests/unit/liteship/facade-contract-parser.test.ts::rejects duplicate root and subpath identities'
      - 'tests/unit/liteship/facade-inhabitation.test.ts::executes one real allocation or read through every public root value'

  # ── Assurance (public declaration ownership + executable paved road) ─
  - id: INV-PUBLIC-SURFACE-INHABITED
    tests:
      - 'tests/unit/devops/public-export-contract.test.ts::the complete package graph has exact declared export contracts'
      - 'tests/unit/devops/public-export-contract.test.ts::refuses an undocumented phantom instead of counting a small surface as healthy'
      - 'tests/property/public-export-inhabitation-laws.prop.test.ts::is deterministic under source-map and entrypoint insertion order'
      - 'tests/unit/liteship/facade-inhabitation.test.ts::executes one real allocation or read through every public root value'
      - 'tests/unit/liteship/facade-inhabitation.test.ts::refuses a phantom paved-road value with no executable example'

  # ── Assurance (gate qualification cannot false-green) ──────────────────────
  - id: INV-GATE-AUTHORITY-INTEGRITY
    tests:
      - 'tests/property/gauntlet-authority-integrity.prop.test.ts::blocks iff any qualification axis fails and identifies the exact failed axes'
      - 'tests/property/feature-edge-authority-mutation-mcdc.prop.test.ts::kills mutants that route engine-owned integrity through waivers or stop it from blocking'
      - 'tests/property/feature-edge-authority-mutation-mcdc.prop.test.ts::proves waiver filtering and unwaivable authority-integrity affect the engine verdict independently'
      - 'tests/property/feature-edge-authority-adversarial.prop.test.ts::blocks iff any of the four current-head qualification axes fails, despite an integrity waiver'
      - 'tests/unit/gauntlet/foundations.test.ts::blocks failed qualification even when a waiver suppresses the gate semantic finding'
      - 'tests/unit/gauntlet/foundations.test.ts::turns a thrown qualification fixture into a bounded blocking receipt'
      - 'tests/unit/gauntlet/foundations.test.ts::preserves a genuine advisory finding from a fully qualified gate'

  # ── Assurance (feature-edge producers + complete subject coverage) ─────────
  - id: INV-FEATURE-EDGE-PRODUCER
    tests:
      - 'tests/property/feature-edge-connectivity-laws.prop.test.ts::orphans are exactly consumers minus producers, independent of observation order'
      - 'tests/property/feature-edge-connectivity-laws.prop.test.ts::producer-only subjects never become false-positive orphan consumers'
      - 'tests/property/feature-edge-authority-mutation-mcdc.prop.test.ts::kills classic mutants for enumerator, duplicate, opacity, missing-family, and aggregate-count decisions'
      - 'tests/property/feature-edge-authority-mutation-mcdc.prop.test.ts::proves independent true/false effect for every feature-edge coverage decision'
      - 'tests/property/feature-edge-authority-mutation-mcdc.prop.test.ts::kills the aggregate family-set/order/digest and missing/duplicate-family mutants'
      - 'tests/property/feature-edge-authority-mutation-mcdc.prop.test.ts::proves independent missing and duplicate family refusal in the aggregate builder'
      - 'tests/property/feature-edge-authority-adversarial.prop.test.ts::is canonical under family, declaration, producer, consumer, and source-image permutations'
      - 'tests/property/feature-edge-authority-adversarial.prop.test.ts::changes family and aggregate digests when semantic owner evidence changes'
      - 'tests/property/feature-edge-authority-adversarial.prop.test.ts::rejects fabricated catalog subjects and makes event projection drift observable in every consumer image'
      - 'tests/property/feature-edge-authority-adversarial.prop.test.ts::retains the escaped MotionProgram RED while the live typed Scene projection precludes it'

  # ── Assurance (public subpath closure — node16 + bundler) — tests/unit/liteship/facade-subpaths.test.ts ─
  - id: INV-CONSUMER-SUBPATH-CLOSURE
    tests:
      - 'tests/unit/liteship/facade-subpaths.test.ts::resolves every subpath to its built dist/*.d.ts under node16'
      - 'tests/unit/liteship/facade-subpaths.test.ts::resolves every subpath to its built dist/*.d.ts under bundler'

  # ── Assurance (diagnostic-code closure) — exact types + independent source backstop ─
  - id: INV-DIAGNOSTIC-CODE-CLOSED
    tests:
      - 'tests/property/web-diagnostic-authority.prop.test.ts::is an exact 18-code relation between live registered emitters and the canonical registry'
      - 'tests/property/web-diagnostic-authority.prop.test.ts::keeps the real parser-backed package corpus clean in both directions'
      - 'tests/property/web-diagnostic-authority.prop.test.ts::resolves literal, no-substitution-template, and local-constant codes without counting prose'
      - 'tests/property/web-diagnostic-authority.prop.test.ts::reds unknown registered identities and bare Web emitters'
      - 'tests/property/web-diagnostic-authority.prop.test.ts::does not let comments, unrelated strings, or uncalled constants satisfy reverse closure'
      - 'tests/unit/error/diagnostic-registry-closure.test.ts::every key agrees with its area and carries complete explanation plus owner metadata'
      - 'tests/unit/error/diagnostic-registry-closure.test.ts::the exact union rejects invented registry and runtime identities at compile time'
      - 'tests/unit/command/explain.test.ts::explains schema/type with area schema and owner @liteship/core/schema'
      - 'tests/unit/gauntlet/gates-dogfood.test.ts::each gate self-proves (red caught, green clean, mutation killed)'
      - 'tests/unit/devops/audit-diagnostic-enrollment.test.ts::audit diagnostic enrollment > is an exact bidirectional projection of every real audit emitter rule'

  # ── The owner-signed deferral (a real future law, no proving test YET) ──────
  # WAIVED, not UNTRACED — the waiver keeps the path honest. When the expiry passes
  # the state machine flips it to EXPIRED and the bridge gate reds. Replace with a
  # `tests:` ref the moment a dedicated vector-clock property suite enrolls it.
  - id: INV-VECTOR-CLOCK-MONOTONIC
    waiver:
      owner: heyoub
      justification: 'The vector-clock monotonicity/merge-max law is exercised transitively by the HLC suite (the HLC carries a logical counter), but it has no DEDICATED property-test enrollment yet. Owner-signed deferral pending a tests/property/vector-clock.prop.test.ts law-marker pass. NOT a placeholder — a declared boundary with a clock: the expiry forces re-confirmation.'
      expiry: '2027-06-22'

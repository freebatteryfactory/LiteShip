# Locks in the P5 .Shape removal.
#
# The old namespace-object pattern merged each primitive's value const with a
# `declare namespace` whose `Shape` member carried the instance type. It paid
# rent nowhere: TypeScript already separates the type and value declaration
# spaces, so the indirection duplicated declaration merging, taxed every reader
# (`watch(cell: Cell.Shape<number>)`), and doubled the apparent symbol count in
# IntelliSense and agent retrieval.
#
# The namespace type-member convention `X.Shape<T>` was retired repo-wide:
# every public type now shares its value's name directly via declaration-space
# merging (`interface Boundary` + `const Boundary`), so signatures read
# `Cell<T>`, never `Cell.Shape<T>`. This rule flags (a) any namespace member
# type/interface literally named `Shape`, and (b) any qualified type reference
# ending in `.Shape` — the two spellings of the dead convention.
# Public top-level `XxxShape` declarations/re-exports are the same duplicate-name
# debt in another spelling, so the rule also rejects those while leaving private
# implementation aliases alone.
#
# Namespaces that merge with a same-name exported VALUE may still carry other
# aux type members (e.g. `Boundary.Spec`, `Lifetime.Finalizer`) — those are
# retired alongside their value consts in the P6 verb-grammar phase, not here.
# Passes clean on the post-P5 tree.
id: no-shape-namespace-type
language: typescript
severity: error
message: "Retired `.Shape` namespace-member convention — use the direct exported generic that shares the value's name."
files:
  - "**/packages/*/src/**"
  - "**/packages/_spine/*.d.ts"
rule:
  any:
    - kind: type_alias_declaration
      has:
        field: name
        regex: "^Shape$"
      inside:
        kind: internal_module
        stopBy: end
    - kind: interface_declaration
      has:
        field: name
        regex: "^Shape$"
      inside:
        kind: internal_module
        stopBy: end
    - kind: nested_type_identifier
      regex: "\\.Shape$"
    - all:
        - kind: export_statement
        - has:
            kind: interface_declaration
            has:
              field: name
              regex: ".+Shape$"
    - all:
        - kind: export_statement
        - has:
            kind: type_alias_declaration
            has:
              field: name
              regex: ".+Shape$"
    - kind: export_specifier
      regex: "(?:^|\\s)[A-Za-z_$][A-Za-z0-9_$]*Shape(?:\\s+as\\s+[A-Za-z_$][A-Za-z0-9_$]*)?$"

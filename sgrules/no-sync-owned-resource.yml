# Public lifecycle drift guard.
#
# The sweep that collapsed the reactive substrate also collapsed teardown onto a
# SINGLE public owned-resource protocol; the sync `OwnedResource` /
# `[Symbol.dispose]` spelling was retired with no alias.
#
# LiteShip exposes one owned-resource protocol: AsyncOwnedResource. Synchronous
# finalizers still execute before dispose() returns; its Promise joins async
# siblings and carries LifetimeDisposeError. Reintroducing OwnedResource would
# recreate a second public lifecycle without adding teardown capability.
id: no-sync-owned-resource
language: typescript
severity: error
message: 'Retired `OwnedResource` lifecycle: public owned handles use `AsyncOwnedResource`, `await dispose()`, and `await using`. Synchronous finalizers still execute before dispose() returns; the Promise is the completion/error channel.'
rule:
  kind: identifier
  regex: '^OwnedResource$'

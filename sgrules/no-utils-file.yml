# Grab-bag ban — a file named `utils.ts` / `helpers.ts` /
# `*-utils.ts` / `*-helpers.ts` is a naming admission that a home was never
# found: it becomes an unbounded dumping ground with no single responsibility and
# no re-export discipline. Every function has a real domain; name the file after
# that domain. The P4 core migration renamed the two core offenders —
# `math-utils.ts` → `motion/clamp.ts` and `type-utils.ts` → domain-owned
# `authoring/types.ts`, `reactive/types.ts`, and `schema/types.ts` — so
# packages/core/src carries ZERO such files today,
# and this rule keeps it that way.
#
# The rule fires on the mere EXISTENCE of a matching file: it matches the
# `program` root node, so any non-empty file at one of the banned paths is an
# error regardless of contents.
#
# SCOPE — every package src tree. The core-first ratchet completed 2026-07-29
# (issue #178): the five grab-bag offenders outside core were renamed to their
# domains (cli spawn-helpers → spawn, cli package-smoke-helpers →
# package-smoke-engine, compiler motion-utils → motion-augment, compiler
# css-utils → css-syntax, vite resolve-utils → try-import), so the glob is
# repo-wide and every package graduates permanently.
#
# Run: `pnpm run lint:structural`  (CI: gauntlet `lint:structural` phase)
id: no-utils-file
language: typescript
severity: error
message: "Grab-bag filename (utils.ts / helpers.ts / *-utils.ts / *-helpers.ts) is forbidden — name the file after its domain (e.g. math-utils → numeric, type-utils → type-level). A util bucket has no single responsibility and no re-export home."
files:
  - "**/packages/*/src/**/utils.ts"
  - "**/packages/*/src/**/helpers.ts"
  - "**/packages/*/src/**/*-utils.ts"
  - "**/packages/*/src/**/*-helpers.ts"
rule:
  kind: program

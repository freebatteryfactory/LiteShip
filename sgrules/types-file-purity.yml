# types.ts purity — a `types.ts` is TYPE-SPACE ONLY: `interface`,
# `type` aliases, and re-exported types. It must be fully ERASABLE — a type-only
# import of it, or a bundler dropping `import type`, leaves nothing behind.
#
# THE CLASS RULE (PR #191 review, rounds 4+5): this rule is an ALLOWLIST, not a
# denylist. TS statement space is an open grammar for a hand-picked "bad forms"
# list — the value-declaration list missed runtime value imports and bare calls
# in round 4, then `export default 1;` in round 5 — so the rule inverts:
#
#   ANCHOR — the COMPLETE statement supertype of the tree-sitter-typescript
#   grammar (every `kind` a top-level statement can be), a CLOSED set that only
#   changes with a grammar upgrade. This is not a curated denylist: nothing is
#   selected, everything statement-shaped is in. `interface_declaration`,
#   `type_alias_declaration`, and comments are simply NOT statements we anchor
#   on — they are the structurally-allowed forms.
#
#   ALLOWLIST (the `not`) — the only anchored statements excused are the
#   fully-erased spellings: top-level `import type ...` (the inline
#   `import { type A }` form still EMITS a live `import {}` under
#   verbatimModuleSyntax — not legal here), `export type ...` (aliases,
#   `export type { X } from`, `export type * from`), and `export`-wrapped
#   interface / type-alias declarations.
#
# Everything else fires without needing to be foreseen: value declarations,
# runtime imports/re-exports, expression statements, `export default`,
# `export =`, `import X = Y`, namespaces, ambient declares, control flow —
# and whatever statement form comes next.
#
# SCOPE — every `types.ts` under every package src tree, INCLUDING the src-root
# barrels. The core-first ratchet completed 2026-07-29 (issue #178): the value
# carriers were relocated into domain modules — mcp-server lsp/types.ts protocol
# constant tables → lsp/protocol.ts, doctor/types.ts probe helpers →
# doctor/probe-support.ts, audit/src/types.ts rule-id roster → rule-ids.ts,
# web/src/types.ts SlotPath brand factory → slot/addressing.ts — so the glob is
# repo-wide and every types.ts is provably erasable.
#
# Run: `pnpm run lint:structural`  (CI: gauntlet `lint:structural` phase)
id: types-file-purity
language: typescript
severity: error
message: "types.ts is type-space only and must be erasable — only `interface`, `type` aliases, `import type`, and `export type` forms are legal here. Move every runtime construct into a domain module and keep only its `interface` / `type` here."
files:
  - "**/packages/*/src/**/types.ts"
rule:
  all:
    # Top-level statements only (direct children of the program node): the
    # allowlist judges what the MODULE does, statement by statement.
    - inside: { kind: program }
    # The grammar's complete statement supertype (ast-grep requires concrete
    # kinds — `kind: statement` and `pattern: $A` cannot anchor a rule).
    - any:
        - kind: export_statement
        - kind: import_statement
        - kind: expression_statement
        - kind: debugger_statement
        - kind: statement_block
        - kind: if_statement
        - kind: switch_statement
        - kind: for_statement
        - kind: for_in_statement
        - kind: while_statement
        - kind: do_statement
        - kind: try_statement
        - kind: with_statement
        - kind: break_statement
        - kind: continue_statement
        - kind: return_statement
        - kind: throw_statement
        - kind: empty_statement
        - kind: labeled_statement
        - kind: function_declaration
        - kind: generator_function_declaration
        - kind: class_declaration
        - kind: abstract_class_declaration
        - kind: lexical_declaration
        - kind: variable_declaration
        - kind: function_signature
        - kind: enum_declaration
        - kind: module
        - kind: internal_module
        - kind: ambient_declaration
        - kind: import_alias
    - not:
        any:
          - all:
              - kind: import_statement
              - regex: "^import\\s+type\\b"
          - all:
              - kind: export_statement
              - any:
                  - has: { field: declaration, kind: interface_declaration }
                  - has: { field: declaration, kind: type_alias_declaration }
                  - regex: "^export\\s+type\\b"

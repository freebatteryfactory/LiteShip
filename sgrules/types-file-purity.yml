# types.ts purity — a `types.ts` is TYPE-SPACE ONLY: `interface`,
# `type` aliases, and re-exported types. It must be fully ERASABLE — a type-only
# import of it, or a bundler dropping `import type`, leaves nothing behind. A
# value definition (function / class / const / let / var / enum) breaks
# erasability and turns the "types" file into a hidden runtime module. Values
# with a definition site belong in a domain module; the type that describes them
# stays here.
#
# Flags the VALUE-declaration node kinds —
#   function_declaration / class_declaration / enum_declaration /
#   lexical_declaration (const/let) / variable_declaration (var)
# — plus the erasure-surviving statement forms: runtime re-exports
# (`export { v } from` / `export * from`, whose `export type` spellings stay
# legal), EVERY import that is not `import type` (a value import or side-effect
# import loads the module at runtime), and top-level expression statements
# (`register();` — pure type space has no expressions). Deliberately NOT
# interface_declaration / type_alias_declaration / `export type ... from` /
# `import type`, which are exactly what a types.ts is for.
#
# SCOPE — every `types.ts` under every package src tree, INCLUDING the src-root
# barrels. The core-first ratchet completed 2026-07-29 (issue #178): the value
# carriers were relocated into domain modules — mcp-server lsp/types.ts protocol
# constant tables → lsp/protocol.ts, doctor/types.ts probe helpers →
# doctor/probe-support.ts, audit/src/types.ts rule-id roster → rule-ids.ts,
# web/src/types.ts SlotPath brand factory → slot/addressing.ts — so the glob is
# repo-wide and every types.ts is provably erasable.
#
# Run: `pnpm run lint:structural`  (CI: gauntlet `lint:structural` phase)
id: types-file-purity
language: typescript
severity: error
message: "types.ts is type-space only and must be erasable — no function/class/const/let/var/enum. Move the value into a domain module and keep only its `interface` / `type` here."
files:
  - "**/packages/*/src/**/types.ts"
rule:
  any:
    - kind: function_declaration
    - kind: class_declaration
    - kind: enum_declaration
    - kind: lexical_declaration
    - kind: variable_declaration
    # Runtime re-exports and side-effect imports survive erasure too (PR #186
    # review, confirmed): `export { v } from './m.js'` / `export * from './m.js'`
    # emit a live runtime binding, and a clause-less `import './m.js'` executes
    # the module for its effects. Their `export type` / `import type` spellings
    # stay legal — those are exactly what a types.ts is for.
    - all:
        - kind: export_statement
        - has: { field: source, kind: string }
        - not: { regex: "^export\\s+type\\b" }
    # EVERY import that is not `import type ...` is runtime (PR #191 review,
    # round 4, confirmed): a value import (`import { register } from ...`) has
    # an import_clause, so the old clause-less-only ban let it through — and an
    # inline-type import (`import { type A } from ...`) still EMITS a live
    # `import {}` under verbatimModuleSyntax. Only the fully-erased top-level
    # `import type` spelling is legal here.
    - all:
        - kind: import_statement
        - not: { regex: "^import\\s+type\\b" }
    # A top-level expression statement (`register();`) is runtime by
    # definition — pure type space has no expressions to execute (PR #191
    # review, round 4, confirmed: `import { register } ...; register();`
    # passed both this rule and the regular lint).
    - kind: expression_statement
